{# Shared styling for the customer sign-in / registration pages. #}
<style>
    .auth-wrap {
        display: flex;
        justify-content: center;
        padding: 0 1rem;
    }
    .auth-card {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
        max-width: 900px;
        background: #fff;
        border-radius: 1rem;
        overflow: hidden;
    }
    .auth-brand {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 2rem;
        padding: 2.5rem;
        color: #fff;
        background: linear-gradient(135deg, var(--accent-color, #0d6efd) 0%, #6610f2 100%);
    }
    .auth-brand-title { font-weight: 700; font-size: 1.6rem; margin-bottom: .75rem; }
    .auth-brand-text { opacity: .9; margin-bottom: 0; }
    .auth-brand-foot { font-size: .9rem; opacity: .95; }
    .auth-brand-foot a { color: #fff; font-weight: 600; text-decoration: underline; }
    .auth-form { padding: 2.5rem; }
    .auth-heading { font-weight: 700; font-size: 1.5rem; margin-bottom: 1.5rem; }
    .auth-alt { font-size: .9rem; }

    /* Google button */
    .btn-google {
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #dadce0;
        background: #fff;
        color: #3c4043;
        font-weight: 500;
        padding: .6rem 1rem;
    }
    .btn-google:hover { background: #f7f8f8; color: #3c4043; border-color: #d2d3d4; }

    /* "or" divider */
    .auth-divider {
        display: flex;
        align-items: center;
        text-align: center;
        color: #9aa0a6;
        font-size: .8rem;
        text-transform: uppercase;
        letter-spacing: .05em;
        margin: 1rem 0;
    }
    .auth-divider::before,
    .auth-divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #e6e6e6;
    }
    .auth-divider span { padding: 0 .75rem; }

    @media (max-width: 767.98px) {
        .auth-card { grid-template-columns: 1fr; max-width: 460px; }
        .auth-brand { order: 2; }
        .auth-form { order: 1; }
    }
</style>
